{% extends "base.html" %}
{% block title %}Create hackathon - HackForge{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width:540px">
        <h1>Create hackathon</h1>
        <p class="auth-subtitle">Set up a new hackathon for the community</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" placeholder="Hackathon title" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" placeholder="Describe the hackathon" required></textarea>
            </div>
            <div class="form-group">
                <label for="rules">Rules</label>
                <textarea name="rules" id="rules" placeholder="Hackathon rules" style="min-height:80px"></textarea>
            </div>
            <div class="form-group">
                <label for="eligibility">Eligibility</label>
                <input type="text" name="eligibility" id="eligibility" placeholder="e.g. Open to all students">
            </div>
            <div class="form-group">
                <label for="prize_info">Prizes</label>
                <input type="text" name="prize_info" id="prize_info" placeholder="e.g. $5000 in prizes">
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" name="location" id="location" value="Online" placeholder="Online or physical location">
            </div>
            <div class="form-group">
                <label for="max_team_size">Max team size</label>
                <input type="number" name="max_team_size" id="max_team_size" value="5" min="1" max="20">
            </div>
            <div class="form-group">
                <label for="start_date">Start date</label>
                <input type="date" name="start_date" id="start_date">
            </div>
            <div class="form-group">
                <label for="end_date">End date</label>
                <input type="date" name="end_date" id="end_date">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status">
                    <option value="draft">Draft</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create hackathon</button>
        </form>
    </div>
</div>
{% endblock %}

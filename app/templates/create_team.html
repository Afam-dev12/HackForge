{% extends "base.html" %}
{% block title %}Create team - HackForge{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width:480px">
        <h1>Create team</h1>
        <p class="auth-subtitle">Form a team for a hackathon</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="name">Team name</label>
                <input type="text" name="name" id="name" placeholder="Team name" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" placeholder="What is your team about?" style="min-height:80px"></textarea>
            </div>
            <div class="form-group">
                <label for="hackathon_id">Hackathon</label>
                <select name="hackathon_id" id="hackathon_id" required>
                    <option value="">Select a hackathon</option>
                    {% for hackathon in hackathons %}
                        <option value="{{ hackathon.id }}" {% if selected_hackathon == hackathon.id or selected_hackathon|string == hackathon.id|string %}selected{% endif %}>
                            {{ hackathon.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create team</button>
        </form>
    </div>
</div>
{% endblock %}

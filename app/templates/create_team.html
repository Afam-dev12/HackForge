{% extends "base.html" %}
{% block title %}Create Team - HackForge{% endblock %}

{% block content %}
<div class="auth-box" style="max-width:500px">
    <div class="card">
        <h1>Create Team</h1>
        <form method="POST">
            <label for="name">Team Name</label>
            <input type="text" name="name" id="name" placeholder="Team name" required>

            <label for="description">Description</label>
            <textarea name="description" id="description" placeholder="What is your team about?"></textarea>

            <label for="hackathon_id">Hackathon</label>
            <select name="hackathon_id" id="hackathon_id" required>
                <option value="">Select a hackathon</option>
                {% for hackathon in hackathons %}
                    <option value="{{ hackathon.id }}" {% if selected_hackathon == hackathon.id or selected_hackathon|string == hackathon.id|string %}selected{% endif %}>
                        {{ hackathon.title }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Create Team</button>
        </form>
    </div>
</div>
{% endblock %}

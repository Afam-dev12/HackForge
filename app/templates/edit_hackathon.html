{% extends "base.html" %}
{% block title %}Edit hackathon - HackForge{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width:540px">
        <h1>Edit hackathon</h1>
        <p class="auth-subtitle">Update hackathon details</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" value="{{ hackathon.title }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" required>{{ hackathon.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="rules">Rules</label>
                <textarea name="rules" id="rules" style="min-height:80px">{{ hackathon.rules }}</textarea>
            </div>
            <div class="form-group">
                <label for="eligibility">Eligibility</label>
                <input type="text" name="eligibility" id="eligibility" value="{{ hackathon.eligibility }}">
            </div>
            <div class="form-group">
                <label for="prize_info">Prizes</label>
                <input type="text" name="prize_info" id="prize_info" value="{{ hackathon.prize_info }}">
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" name="location" id="location" value="{{ hackathon.location }}">
            </div>
            <div class="form-group">
                <label for="max_team_size">Max team size</label>
                <input type="number" name="max_team_size" id="max_team_size" value="{{ hackathon.max_team_size }}" min="1" max="20">
            </div>
            <div class="form-group">
                <label for="start_date">Start date</label>
                <input type="date" name="start_date" id="start_date" value="{{ hackathon.start_date }}">
            </div>
            <div class="form-group">
                <label for="end_date">End date</label>
                <input type="date" name="end_date" id="end_date" value="{{ hackathon.end_date }}">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status">
                    <option value="draft" {% if hackathon.status == 'draft' %}selected{% endif %}>Draft</option>
                    <option value="active" {% if hackathon.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="completed" {% if hackathon.status == 'completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save changes</button>
        </form>
    </div>
</div>
{% endblock %}
